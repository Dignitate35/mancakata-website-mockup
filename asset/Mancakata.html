<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mancakata — Penerjemahan & Lokalisasi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter+Tight:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />
<style>
  /* Form inputs */
  .form-input {
    width: 100%;
    padding: 12px 14px;
    background: var(--paper-50);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink-900);
    outline: none;
    transition: border 0.15s;
  }
  .form-input:focus { border-color: var(--accent); }
  textarea.form-input { resize: vertical; min-height: 80px; }
</style>
</head>
<template id="__bundler_thumbnail" data-bg-color="#fbf9f3">
<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="160" fill="#fbf9f3"/>
  <text x="100" y="45" font-family="Georgia, serif" font-size="32" font-weight="300" text-anchor="middle" fill="#14110d">
    Manca<tspan fill="#15663d">K</tspan>ata
  </text>
  <text x="100" y="75" font-family="system-ui" font-size="10" text-anchor="middle" fill="#8c8474" letter-spacing="2">
    PENERJEMAHAN & LOKALISASI
  </text>
  <line x1="40" y1="100" x2="160" y2="100" stroke="#d8d2c0" stroke-width="0.5"/>
  <circle cx="50" cy="125" r="8" fill="#15663d" opacity="0.8"/>
  <circle cx="100" cy="125" r="8" fill="#b8682a" opacity="0.8"/>
  <circle cx="150" cy="125" r="8" fill="#15663d" opacity="0.6"/>
</svg>
</template>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="pages.jsx"></script>
<script type="text/babel" src="cms.jsx"></script>

<script type="text/babel" data-presets="env,react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "duotone",
  "heroVariant": "split"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = React.useState("home");

  React.useEffect(() => {
    document.documentElement.setAttribute("data-accent", t.accent);
  }, [t.accent]);

  React.useEffect(() => { window.scrollTo(0, 0); }, [page]);

  const navigate = (p) => setPage(p);

  // CMS is full-screen (no public chrome)
  if (page === "cms") {
    return <>
      <CmsAdmin onExit={() => navigate("home")} />
      <TweaksPanel>
        <TweakSection label="Navigation" />
        <TweakSelect label="View" value={page}
          options={[
            { label: "← Public site (Home)", value: "home" },
            { label: "CMS Admin", value: "cms" },
          ]}
          onChange={(v) => setPage(v)} />
      </TweaksPanel>
    </>;
  }

  let pageEl;
  switch (page) {
    case "services":      pageEl = <ServicesPage onNavigate={navigate} />; break;
    case "service-detail":pageEl = <ServiceDetailPage onNavigate={navigate} />; break;
    case "blog":          pageEl = <BlogPage onNavigate={navigate} />; break;
    case "blog-detail":   pageEl = <BlogDetailPage onNavigate={navigate} />; break;
    case "about":         pageEl = <AboutPage onNavigate={navigate} />; break;
    case "contact":       pageEl = <ContactPage onNavigate={navigate} />; break;
    default:              pageEl = <HomePage onNavigate={navigate} heroVariant={t.heroVariant} />;
  }

  return (
    <>
      <Navbar current={page} onNavigate={navigate} />
      {pageEl}
      <Footer onNavigate={navigate} />

      <TweaksPanel>
        <TweakSection label="Navigation" />
        <TweakSelect label="Halaman" value={page}
          options={[
            { label: "Home", value: "home" },
            { label: "Services list", value: "services" },
            { label: "Service detail", value: "service-detail" },
            { label: "Blog list", value: "blog" },
            { label: "Blog detail", value: "blog-detail" },
            { label: "About", value: "about" },
            { label: "Contact", value: "contact" },
            { label: "─ CMS Admin ─", value: "cms" },
          ]}
          onChange={(v) => setPage(v)} />

        <TweakSection label="Brand accent" />
        <TweakRadio label="Accent" value={t.accent}
          options={[
            { label: "Duo", value: "duotone" },
            { label: "Hijau", value: "forest" },
            { label: "Terra", value: "terracotta" },
          ]}
          onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Hero variant (Home)" />
        <TweakRadio label="Layout" value={t.heroVariant}
          options={[
            { label: "Enterprise", value: "enterprise" },
            { label: "Split", value: "split" },
            { label: "Editorial", value: "editorial" },
          ]}
          onChange={(v) => setTweak('heroVariant', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
